<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'Arte della Guerra — per Stefania</title>
<meta name="description" content="Versione personalizzata per Stefania Ionescu della raccolta di passaggi da L'arte della guerra di Sun Tzu.">
<meta name="robots" content="noindex, follow">

<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/citazioni.css">
<script src="../assets/theme-init.js"></script>
<style>
  :root{
    --accent:#9a7508; --accent-ink:#ffffff; --wrap-w:44rem;
    --font-citazione: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  }
  :root[data-theme="dark"]{ --accent:#d8b23f; --accent-ink:#1a1403; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --accent:#d8b23f; --accent-ink:#1a1403; }
  }
  .citazione blockquote{ font-style:italic; }

  .ritratto{
    display:block; width:100%; height:auto;
    border-radius:var(--radius); border:1px solid var(--stroke);
    transition:transform .3s var(--ease), border-color .3s var(--ease);
  }
  a:hover .ritratto{ transform:scale(1.012); border-color:var(--accent); }
  .firma{ display:flex; flex-direction:column; gap:.35rem; align-items:center; text-align:center; }
</style>
</head>
<body>

<main class="wrap stack-lg">

  <div class="firma">
    <a href="https://linkedin.com/in/stefania-i-98917b2a6" target="_blank" rel="noopener noreferrer"
       aria-label="Profilo LinkedIn di Stefania">
      <img class="ritratto" src="stefania.webp" width="900" height="227" loading="eager"
           alt="Stefania — tocca per aprire il suo profilo LinkedIn">
    </a>
    <p class="muted small">Tocca l'immagine per il profilo LinkedIn di Stefania</p>
  </div>

  <div class="hero center" style="align-items:center">
    <p class="eyebrow">Sun Tzu · VI-V secolo a.C.</p>
    <h1>L'Arte della Guerra</h1>
    <p class="lede">Una versione tutta tua di questa raccolta: gli stessi novantasette passaggi, con i tuoi preferiti tenuti da parte.</p>
  </div>

  <section class="stack">
    <div id="citazione-box"></div>

    <div class="row-wrap no-print" style="justify-content:center">
      <button class="btn btn-primary" type="button" id="pesca">Un altro insegnamento</button>
      <button class="btn" type="button" id="del-giorno">Quello di oggi</button>
    </div>
    <p class="muted small center" id="conta"></p>
  </section>

  <section class="card no-print">
    <div class="field">
      <label class="field-label" for="ricerca">Cerca fra i passaggi</label>
      <input type="search" id="ricerca" placeholder="Una parola: nemico, terreno, generale…" autocomplete="off">
    </div>
    <div class="comandi due">
      <div class="field">
        <label class="field-label" for="filtro-tema">Tema</label>
        <select id="filtro-tema"></select>
      </div>
      <div class="field">
        <label class="field-label" for="quante">Quanti alla volta</label>
        <select id="quante">
          <option value="1" selected>Uno</option>
          <option value="3">Tre</option>
          <option value="5">Cinque</option>
        </select>
      </div>
    </div>
    <div class="field" hidden>
      <label class="sr-only" for="filtro-autore">Autore</label>
      <select id="filtro-autore"></select>
    </div>
  </section>

  <section class="card" id="preferiti-box" hidden>
    <h2 style="font-size:var(--t-2)">I tuoi preferiti</h2>
    <div id="preferiti"></div>
    <div class="row-wrap no-print">
      <button class="btn btn-sm" type="button" id="stampa">Salva in PDF</button>
    </div>
  </section>

</main>

<script src="../assets/shell.js" data-app="app14-stefy" data-title="Per Stefania"></script>
<script src="../assets/citazioni.js"></script>
<script src="citazioni.js"></script>
<script>
(function () {
  'use strict';

  // stessi passaggi dell'app principale: si aggiornano insieme.
  // I preferiti invece sono suoi, sotto una chiave separata.
  Citazioni.avvia({
    app: 'app14-stefy',
    dati: window.CITAZIONI_SUNTZU,
    titoloCondivisione: "L'Arte della Guerra",
    parolaPlurale: ' passaggi',
    etichettaGiorno: "L'insegnamento di oggi",
    nessunRisultato: 'Nessun passaggio corrisponde a questa ricerca.'
  });

  const stampa = Shell.$('#stampa');
  if (stampa) stampa.addEventListener('click', Shell.print);
})();
</script>
</body>
</html>
