<head>

    <!-- Caricamento di Tailwind CSS -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');
        
        /* Font classico per le citazioni */
        .quote-font {
            font-family: 'Playfair Display', serif;
        }
        
        .inter-font {
            font-family: 'Inter', sans-serif;
        }
        
        /* Stile personalizzato per il pulsante */
        .quote-button {
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .quote-button:hover {
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .quote-button:active {
            transform: translateY(0);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Stile per le singole citazioni multiple */
        .quote-item {
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .quote-item.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="inter-font bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">

    <!-- Contenitore Principale -->

        <!-- Controlli: numero di citazioni -->
        <div class="flex items-center justify-center gap-3 mb-6">
            <label for="num-quotes" class="text-sm text-gray-300">Mostra</label>
            <input id="num-quotes" type="number" min="1" max="6" value="2" class="w-16 px-3 py-2 rounded-full text-gray-900 font-semibold focus:outline-none" />
            <span class="text-sm text-gray-300">citazioni</span>
        </div>

        <!-- Card per le Citazioni multiple -->
        <div id="quotes-card" class="bg-gray-800 p-6 md:p-8 rounded-xl shadow-2xl border border-gray-700 mb-6">
            <div id="quotes-container" class="space-y-4">
                <!-- ...existing code... -->
                <blockquote class="quote-font text-xl md:text-2xl italic leading-relaxed text-gray-200">
                    <p id="quote-text" class="mb-4">
                        Caricamento della saggezza...
                    </p>
                    <footer class="text-sm font-semibold text-yellow-500 mt-6">
                        — Sun Tzu
                    </footer>
                </blockquote>
                <!-- ...existing code... -->

        <!-- Pulsante di Generazione -->
        <button id="generate-button" 
                class="quote-button inter-font w-full sm:w-auto px-8 py-3 bg-yellow-600 hover:bg-yellow-700 text-gray-900 font-bold rounded-full text-lg uppercase tracking-wider focus:outline-none focus:ring-4 focus:ring-yellow-500 focus:ring-opacity-50">
            Nuovo Insegnamento
        </button>

    </div>

        const quotesContainer = document.getElementById('quotes-container');
        const generateButton = document.getElementById('generate-button');
        const numInput = document.getElementById('num-quotes');

        // Restituisce un array con n elementi scelti casualmente senza ripetizioni
        function pickRandomUnique(arr, n) {
            const copy = arr.slice();
            // Fisher-Yates shuffle parziale
            let len = copy.length;
            n = Math.min(n, len);
            for (let i = 0; i < n; i++) {
                const r = i + Math.floor(Math.random() * (len - i));
                [copy[i], copy[r]] = [copy[r], copy[i]];
            }
            return copy.slice(0, n);
        }

        // Pulisce il contenitore e mostra le citazioni scelte
        function renderQuotes(list) {
            quotesContainer.innerHTML = ''; // rimuove contenuto precedente

            if (list.length === 0) {
                const el = document.createElement('p');
                el.className = 'quote-font text-lg text-gray-200';
                el.textContent = 'Nessuna saggezza da mostrare.';
                quotesContainer.appendChild(el);
                return;
            }

            list.forEach((q, idx) => {
                const block = document.createElement('blockquote');
                block.className = 'quote-item quote-font text-lg md:text-xl italic leading-relaxed text-gray-200 bg-gray-800/0';
                // aggiunta footer Sun Tzu per ogni citazione
                block.innerHTML = `<p class="mb-2">${q}</p><footer class="text-sm font-semibold text-yellow-500 mt-2">— Sun Tzu</footer>`;
                quotesContainer.appendChild(block);
                // animazione con delay leggero per ogni elemento
                setTimeout(() => block.classList.add('visible'), 60 * idx);
            });
        }

        // Genera e mostra quote in base al numero selezionato
        function generateQuotes() {
            const requested = parseInt(numInput.value, 10) || 1;
            const count = Math.max(1, Math.min(requested, quotes.length, 6)); // limite max per layout
            const selection = pickRandomUnique(quotes, count);
            renderQuotes(selection);
        }

        // Inizializzazione
        window.addEventListener('DOMContentLoaded', () => {
            // Mostra alcune citazioni all'avvio
            generateQuotes();

            // Eventi
            generateButton.addEventListener('click', generateQuotes);
            numInput.addEventListener('change', () => {
                // aggiorna immediatamente al cambiare del numero
                generateQuotes();
            });
        });
    </script>
</body>
</html>
